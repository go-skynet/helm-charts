{{/*
Secrets the chart generates when no existing Secret is given. Values are kept across upgrades
(looked up from the cluster). `helm template` and GitOps tools that render without cluster access
get fresh random values on every render: set the values or existing Secrets there.
The HMAC secret outlives the release (resource-policy keep), like an external account database
whose API keys it signs, and so does the P2P token (outside machines may have joined with it). The built-in PostgreSQL's password is kept with its data
(persistence.data.retain), and otherwise goes with it on uninstall.
*/}}
{{- if and (include "local-ai.authEnabled" .) (not .Values.auth.hmacSecret.existingSecret) }}
{{- $name := include "local-ai.hmacSecret" . }}
{{- $secret := "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (hasKey ($existing.data | default dict) "hmac-secret") }}
{{- $secret = index $existing.data "hmac-secret" | b64dec }}
{{- else }}
{{- $secret = randAlphaNum 64 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "local-ai.labels" (dict "root" $ "component" "frontend") | nindent 4 }}
  {{- include "local-ai.metaAnnotations" (dict "root" $ "extra" (dict "helm.sh/resource-policy" "keep")) }}
type: Opaque
data:
  hmac-secret: {{ $secret | b64enc | quote }}
{{- end }}
{{- if and (eq .Values.mode "distributed") (not .Values.distributed.registrationToken.existingSecret) }}
{{- $name := include "local-ai.registrationTokenSecret" . }}
{{- $token := .Values.distributed.registrationToken.value }}
{{- if not $token }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (hasKey ($existing.data | default dict) "token") }}
{{- $token = index $existing.data "token" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 48 }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "local-ai.labels" (dict "root" $ "component" "frontend") | nindent 4 }}
  {{- include "local-ai.metaAnnotations" (dict "root" $) }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
{{- if and (eq .Values.mode "p2p") (not .Values.p2p.token.existingSecret) }}
{{- $name := include "local-ai.p2pTokenSecret" . }}
{{- $token := .Values.p2p.token.value }}
{{- if not $token }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (hasKey ($existing.data | default dict) "token") }}
{{- $token = index $existing.data "token" | b64dec }}
{{- else }}
{{- /* Same shape as LocalAI's p2p.GenerateToken: base64 of an EdgeVPN connection config, with
LocalAI's default DHT and OTP rotation intervals (--p2p-dht-interval 360, --p2p-otp-interval 9000). */}}
{{- $cfg := dict
  "otp" (dict
    "dht" (dict "interval" 360 "key" (randAlphaNum 43) "length" 43)
    "crypto" (dict "interval" 9000 "key" (randAlphaNum 43) "length" 43))
  "room" (randAlphaNum 43)
  "rendezvous" (randAlphaNum 43)
  "mdns" (randAlphaNum 43)
  "max_message_size" 20971520 }}
{{- $token = toYaml $cfg | b64enc }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "local-ai.labels" (dict "root" $ "component" "frontend") | nindent 4 }}
  {{- /* Kept: machines outside the cluster may have joined with it. */}}
  {{- include "local-ai.metaAnnotations" (dict "root" $ "extra" (dict "helm.sh/resource-policy" "keep")) }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
{{- $name := include "local-ai.postgresqlSecret" . }}
{{- $password := "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (hasKey ($existing.data | default dict) "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "local-ai.labels" (dict "root" $ "component" "postgresql") | nindent 4 }}
  {{- include "local-ai.metaAnnotations" (dict "root" $ "extra" (ternary (dict "helm.sh/resource-policy" "keep") dict (.Values.persistence.data.retain | default false))) }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
{{- if and .Values.nats.enabled (not .Values.nats.existingSecret) }}
{{- $name := include "local-ai.natsSecret" . }}
{{- $token := "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (hasKey ($existing.data | default dict) "token") }}
{{- $token = index $existing.data "token" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 48 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "local-ai.labels" (dict "root" $ "component" "nats") | nindent 4 }}
  {{- include "local-ai.metaAnnotations" (dict "root" $) }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
