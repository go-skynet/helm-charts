{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "local-ai.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "local-ai.labels" (dict "root" $ "component" "frontend") | nindent 4 }}
  {{- include "local-ai.metaAnnotations" (dict "root" $ "extra" .Values.serviceAccount.annotations) }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- $minAvailable := .Values.frontend.pdb.minAvailable }}
{{- /* Only with room for a disruption: never for one frontend (even "50%" of 1 rounds up to 1). */}}
{{- $replicas := int .Values.frontend.replicaCount }}
{{- if and .Values.frontend.pdb.enabled (gt $replicas 1) (or (kindIs "string" $minAvailable) (gt $replicas (int $minAvailable))) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "local-ai.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "local-ai.labels" (dict "root" $ "component" "frontend") | nindent 4 }}
  {{- include "local-ai.metaAnnotations" (dict "root" $) }}
spec:
  minAvailable: {{ .Values.frontend.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "local-ai.selectorLabels" (dict "root" $ "component" "frontend") | nindent 6 }}
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "local-ai.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $l := mergeOverwrite (include "local-ai.labels" (dict "root" $ "component" "frontend") | fromYaml) (deepCopy (.Values.serviceMonitor.labels | default dict)) }}
    {{- toYaml $l | nindent 4 }}
  {{- include "local-ai.metaAnnotations" (dict "root" $) }}
spec:
  selector:
    matchLabels:
      {{- include "local-ai.selectorLabels" (dict "root" $ "component" "frontend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- with .Values.serviceMonitor.bearerTokenSecret }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .name }}
          key: {{ .key }}
      {{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
{{- $release := include "local-ai.releaseSelector" . }}
---
# The frontend Service port is open (optionally to selected sources only).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "local-ai.componentName" (dict "root" $ "name" "frontend") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "local-ai.labels" (dict "root" $ "component" "frontend") | nindent 4 }}
  {{- include "local-ai.metaAnnotations" (dict "root" $) }}
spec:
  podSelector:
    matchLabels:
      {{- include "local-ai.selectorLabels" (dict "root" $ "component" "frontend") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.frontendIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - from:
        - podSelector:
            matchLabels:
              {{- $release | nindent 14 }}
---
# Everything else (workers, chat workers, add-on owner, P2P helpers, databases) only accepts
# traffic from this release's pods. Workers expose a whole port range (one per loaded model).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "local-ai.componentName" (dict "root" $ "name" "internal") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "local-ai.labels" (dict "root" $ "component" "frontend") | nindent 4 }}
  {{- include "local-ai.metaAnnotations" (dict "root" $) }}
spec:
  podSelector:
    matchLabels:
      {{- $release | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values:
          - frontend
          - federated
          - explorer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $release | nindent 14 }}
{{- end }}
{{- if and (not .Values.networkPolicy.enabled) .Values.networkPolicy.backplane }}
{{- $components := list }}
{{- if .Values.nats.enabled }}{{ $components = append $components "nats" }}{{ end }}
{{- if .Values.postgresql.enabled }}{{ $components = append $components "postgresql" }}{{ end }}
{{- range (include "local-ai.workerPools" . | fromYaml).pools }}
{{- if has .type (list "llama-cpp-rpc" "vllm" "ds4-distributed") }}{{ $components = append $components (printf "worker-%s" .name) }}{{ end }}
{{- end }}
{{- if $components }}
---
# Components that speak unauthenticated (or, for NATS, token-only) protocols only accept this
# release's pods, even without networkPolicy.enabled (networkPolicy.backplane: false turns it off).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "local-ai.componentName" (dict "root" $ "name" "backplane") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "local-ai.labels" (dict "root" $ "component" "frontend") | nindent 4 }}
  {{- include "local-ai.metaAnnotations" (dict "root" $) }}
spec:
  podSelector:
    matchLabels:
      {{- include "local-ai.releaseSelector" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          {{- toYaml $components | nindent 10 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "local-ai.releaseSelector" . | nindent 14 }}
{{- end }}
{{- end }}
