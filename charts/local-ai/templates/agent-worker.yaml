{{- if .Values.agentWorker.enabled }}
{{- $aw := .Values.agentWorker -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "local-ai.componentName" (dict "root" $ "name" "agent-worker") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "local-ai.labels" (dict "root" $ "component" "agent-worker") | nindent 4 }}
  {{- include "local-ai.metaAnnotations" (dict "root" $) }}
spec:
  replicas: {{ $aw.replicaCount }}
  selector:
    matchLabels:
      {{- include "local-ai.selectorLabels" (dict "root" $ "component" "agent-worker") | nindent 6 }}
  template:
    {{- include "local-ai.podMetadata" (dict "root" $ "comp" $aw "component" "agent-worker") | nindent 4 }}
    spec:
      {{- include "local-ai.podCommon" (dict "root" $ "comp" $aw "gracePeriod" 30) | trim | nindent 6 }}
      {{- $wait := include "local-ai.waitInit" (dict "root" $ "image" $aw.image "nats" true "frontend" true) }}
      {{- if or $wait $aw.initContainers }}
      initContainers:
        {{- with $wait }}
        {{- . | trim | nindent 8 }}
        {{- end }}
        {{- with $aw.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: local-ai
          image: {{ include "local-ai.image" (dict "root" $ "image" $aw.image) }}
          imagePullPolicy: {{ include "local-ai.imagePullPolicy" (dict "root" $ "image" $aw.image) }}
          args:
            - agent-worker
          {{- $env := list
                (include "local-ai.env.pod" .)
                "- name: LOCALAI_NODE_NAME\n  value: $(POD_NAME)"
                (printf "- name: LOCALAI_REGISTER_TO\n  value: %s" (include "local-ai.registerUrl" . | quote))
                (include "local-ai.env.distributedClient" (dict "root" $ "role" "agent-worker"))
                (include "local-ai.env.user" (dict "root" $ "comp" $aw)) }}
          env:
            {{- include "local-ai.env.dedupe" (join "\n" $env) | nindent 12 }}
          {{- with include "local-ai.envFrom" (dict "root" $ "comp" $aw) }}{{ . | trim | nindent 10 }}{{- end }}
          {{- /* The agent worker has no HTTP server: probes only if configured. */}}
          {{- with include "local-ai.probes" $aw }}{{ . | trim | nindent 10 }}{{- end }}
          {{- with $aw.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "local-ai.securityContext" (dict "root" $ "comp" $aw) }}{{ . | trim | nindent 10 }}{{- end }}
          {{- $mounts := include "local-ai.fileMounts" (dict "root" $) }}
          {{- if or $mounts $aw.extraVolumeMounts }}
          volumeMounts:
            {{- with $mounts }}{{ . | trim | nindent 12 }}{{- end }}
            {{- with $aw.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- with $aw.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $vols := include "local-ai.fileVolumes" (dict "root" $) }}
      {{- if or $vols $aw.extraVolumes }}
      volumes:
        {{- with $vols }}{{ . | trim | nindent 8 }}{{- end }}
        {{- with $aw.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
